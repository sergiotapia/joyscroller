    <ellipse cx="1380" cy="180" rx="160" ry="36"/>
    <ellipse cx="620" cy="140" rx="120" ry="26"/>
    <ellipse cx="1250" cy="420" rx="180" ry="30"/>
    <ellipse cx="420" cy="430" rx="160" ry="28"/>
