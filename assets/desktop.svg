<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d5fd6"/>
      <stop offset=".45" stop-color="#4f93ea"/>
      <stop offset=".75" stop-color="#a9cff6"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0" stop-color="#9ee04b"/>
      <stop offset=".35" stop-color="#5fb82a"/>
      <stop offset="1" stop-color="#2d7a12"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fbf3a"/>
      <stop offset="1" stop-color="#2f7d18"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
