<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<!-- The Mac app icon: the top bar's splat (assets/splat.svg) on a tile in
     the taskbar's blue, sized to macOS's icon grid (824 px tile, 100 px
     margin). Render it with
       rsvg-convert -w 1024 -h 1024 packaging/macos/icon.svg -o packaging/macos/icon.png
     after changing it; packaging/macos/make-app.sh turns icon.png into AppIcon.icns. -->
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#4993e6"/>
<stop offset=".45" stop-color="#2663e0"/>
<stop offset="1" stop-color="#1941a5"/>
</linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity=".35"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
</defs>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
<rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#0c2f86" stroke-width="8"/>
<path d="M285 100h454a185 185 0 0 1 185 185v95c-180-60-640-60-824 0v-95A185 185 0 0 1 285 100z" fill="url(#gloss)"/>
