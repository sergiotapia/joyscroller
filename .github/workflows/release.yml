# Publishes a GitHub Release when a version tag is pushed: move
# CHANGELOG.md's Unreleased notes under the new version, bump `version` in
# Cargo.toml, commit, then
#   git tag v0.2.0 && git push origin v0.2.0
#
# The release's description is the version's section of CHANGELOG.md plus
# its compare link and how to install on each OS, and the release fails
# without the changelog section, so a version can't ship undescribed. The
# tagged commit has to pass CI (ci.yml: the lints and the tests on every OS)
# before anything is built. The downloads come from the Package workflow
# (package.yml), which builds them for Linux and macOS and smoke-tests each,
# plus a SHA256SUMS. The release starts as a draft and is only published once
# everything has uploaded, so a failed build never leaves a release with
# missing downloads.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG doesn't match Cargo.toml's version $version" >&2
            exit 1
          fi
      - name: Take the release notes from CHANGELOG.md
        run: |
          version=${TAG#v}
          # The version's section, without its heading or the blank lines around it.
          notes=$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md | sed '/./,$!d')
          compare=$(grep -m1 "^\[$version\]: " CHANGELOG.md | cut -d' ' -f2 || true)
          if [ -z "${notes//[[:space:]]/}" ] || [ -z "$compare" ]; then
            echo "CHANGELOG.md has no notes or no compare link for $version" >&2
            exit 1
          fi
          printf '%s\n\n%s\n\n**Full Changelog**: %s\n' "$notes" "$(cat packaging/install-notes.md)" "$compare" > notes.md
      - run: gh release create "$TAG" --draft --verify-tag --notes-file notes.md --title "$TAG"

  package:
    needs: [ci, draft]
    uses: ./.github/workflows/package.yml
    with:
      label: ${{ github.ref_name }}

  upload:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: joyscroller-*
          merge-multiple: true
          path: dist
      - name: Upload the downloads and their checksums
        working-directory: dist
        run: |
          sha256sum joyscroller-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" joyscroller-* SHA256SUMS --repo "$GITHUB_REPOSITORY"

  publish:
    needs: upload
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: gh release edit "$TAG" --draft=false --latest
