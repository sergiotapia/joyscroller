# Builds joyscroller for Linux and publishes a GitHub Release when a version
# tag is pushed: move CHANGELOG.md's Unreleased notes under the new version,
# bump `version` in Cargo.toml, commit, then
#   git tag v0.2.0 && git push origin v0.2.0
#
# The release's description is the version's section of CHANGELOG.md plus
# its compare link, and the release fails without them, so a version can't
# ship undescribed. It starts as a draft and is only published once every
# build has uploaded, so a failed build never leaves a release with missing
# downloads.
# Ubuntu 22.04 runners keep the glibc requirement at 2.35, old enough for any
# current distro.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG doesn't match Cargo.toml's version $version" >&2
            exit 1
          fi
      - name: Take the release notes from CHANGELOG.md
        run: |
          version=${TAG#v}
          # The version's section, without its heading or the blank lines around it.
          notes=$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md | sed '/./,$!d')
          compare=$(grep -m1 "^\[$version\]: " CHANGELOG.md | cut -d' ' -f2 || true)
          if [ -z "${notes//[[:space:]]/}" ] || [ -z "$compare" ]; then
            echo "CHANGELOG.md has no notes or no compare link for $version" >&2
            exit 1
          fi
          printf '%s\n\n\n**Full Changelog**: %s\n' "$notes" "$compare" > notes.md
      - run: gh release create "$TAG" --draft --verify-tag --notes-file notes.md --title "$TAG"

  build:
    needs: draft
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          name="joyscroller-$TAG-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp target/release/joyscroller README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sha256"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: gh release edit "$TAG" --draft=false --latest
