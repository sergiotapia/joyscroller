[package]
name = "joyscroller"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
cbc = "0.2.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
pbkdf2 = "0.13.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
secret-service = { version = "5.2.0", features = ["rt-tokio-crypto-rust"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they catch here.
similar_names = "allow"            # v10_key / v11_key are named after the format

# Off-by-default lints that catch common slop.
unwrap_used = "warn"
expect_used = "warn"
map_err_ignore = "warn"            # .map_err(|_| ...) throws away the cause
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
redundant_clone = "warn"           # .clone() sprinkled to appease the borrow checker
needless_collect = "warn"
