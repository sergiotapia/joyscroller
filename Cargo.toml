[package]
name = "joyscroller"
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sergiotapia/joyscroller"
publish = false

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio"] }
base64 = "0.23.1"
cbc = "0.2.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
liblzma = { version = "0.4.8", features = ["static"] }
pbkdf2 = "0.13.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
ureq = "3.4.2"
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Where each OS keeps the browser's cookie password.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2.0", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
security-framework = { version = "3.7.0", default-features = false }

[profile.release]
# Debug symbols triple the download size, and users never debug the app.
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they catch here.
similar_names = "allow"            # v10_key / v11_key are named after the format

# Off-by-default lints that catch common slop.
unwrap_used = "warn"
expect_used = "warn"
map_err_ignore = "warn"            # .map_err(|_| ...) throws away the cause
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
redundant_clone = "warn"           # .clone() sprinkled to appease the borrow checker
mod_module_files = "warn"          # a module with submodules is foo.rs + foo/, never foo/mod.rs
needless_collect = "warn"
