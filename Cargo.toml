[package]
name = "joyscroller"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
cbc = "0.2.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
hex = "0.4.3"
pbkdf2 = "0.13.0"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
secret-service = { version = "5.2.0", features = ["rt-tokio-crypto-rust"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
